<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- content.section.sectionType.page4 = 'dettaglioCertificazioni' -->
<th:block th:fragment="content">
    <section class="pt-50 pb-100">
        <div class="container">
            <div class="row gx-35">

                <div class="col-lg-8">

                    <div class="mb-30 text-center" th:if="${post.logo != null and !post.logo.isEmpty()}">
                        <img th:src="${config.imagesRepositoryWeb + post.logo}" th:alt="${post.titolo}" style="max-height:160px; width:auto;"/>
                    </div>

                    <div th:if="${post.riassunto != null and !post.riassunto.isEmpty()}" class="fw-600 mb-20" style="font-size:18px;" th:utext="${post.riassunto}">Riassunto</div>

                    <div th:if="${post.testo != null and !post.testo.isEmpty()}" th:utext="${post.testo}"></div>

                    <div th:if="${post.allegati != null and !post.allegati.isEmpty()}" class="sidebar-widget mt-30">
                        <h5 class="sidebar-widget-title mb-20">Documenti</h5>
                        <ul class="list-unstyled mb-0">
                            <li th:each="allegato : ${post.allegati}" class="pb-15 mb-15" style="border-bottom:1px solid rgba(0,0,0,.08);">
                                <a th:href="@{'/filesId/' + ${allegato.id} + '/' + ${allegato.l2} + '/' + ${allegato.l1} + '.' + ${allegato.type}}"
                                   target="_blank">
                                    <img th:src="@{|/${config.sito.path2}/jsp/icons/32/${allegato.typeIcon}.png|}" alt="" style="margin-right:10px;"/>
                                    <span th:text="${allegato.l1}">Nome file</span>
                                </a>
                            </li>
                        </ul>
                    </div>

                </div>

                <div class="col-lg-4">
                    <div class="position-sticky border-radius-20 overflow-hidden" style="top:100px;">
                        <div th:replace="~{site01/fragments/jspUser/contatti2 :: contatti2(oggettoRichiesta=${post.titolo}, idOggettoRichiesta=${post.id})}"></div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</th:block>
</body>
</html>
