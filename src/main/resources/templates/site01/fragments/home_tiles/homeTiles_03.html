<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="homeTiles_03">

    <style>
        .it-cat-tile {
            display: block;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            line-height: 0;
            transition: box-shadow .25s ease, transform .25s ease;
        }
        .it-cat-tile:hover {
            box-shadow: 0 14px 30px rgba(18, 102, 241, 0.18), 0 2px 8px rgba(1,6,20,0.06);
            transform: translateY(-4px) scale(1.02);
        }
        .it-cat-tile:hover img {
            transform: scale(1.05);
        }
        .it-cat-tile::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 45%;
            height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-20deg);
            transition: left .65s ease;
            pointer-events: none;
            z-index: 1;
        }
        .it-cat-tile:hover::after { left: 130%; }
                .it-cat-tile {
            max-width: 180px;
            margin: 0 auto;
        }
        .it-cat-tile img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform .4s ease;
        }
    </style>

    <section class="it-categories-area pt-80 pb-95">

                    </div>
                </div>
            </div>

            <div class="row justify-content-center">

                <div class="col-6 col-md-4 col-lg-2 mb-4">
                    <div class="text-center">
                        <a th:href="@{/front/319/Assistenza_hardware_e_software}" class="d-block it-cat-tile">
                            <img th:src="@{/site01/images/assistenza_tecnica.png}" alt="Assistenza tecnica"/>

                <div class="col-6 col-md-4 col-lg-2 mb-4">
