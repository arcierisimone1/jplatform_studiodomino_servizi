<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="sectionTitle">
    <div class="it-breadcrumb-area fix z-index-1"
         th:style="${section != null and section.info5 != null and !section.info5.isEmpty() and section.info5 != '0'} ? 'background-image: url(' + ${config.imagesRepositoryWeb} + ${section.info5} + ');' : 'background-image: url(/site01/assets/img/shape/breadcrumb-1-bg.png);'">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <div class="it-breadcrumb-content text-center z-index-1">
                        <div class="it-breadcrumb-title-box">
                            <h1 class="it-breadcrumb-title" th:text="${section != null ? section.titolo : ''}">Titolo Sezione</h1>
                        </div>
                        <div class="it-breadcrumb-list-wrap">
                            <div class="it-breadcrumb-list">
                                <span th:if="${breadcrumb.items == null or breadcrumb.items.isEmpty() or !#strings.equalsIgnoreCase(breadcrumb.items[0].titolo, 'Home')}">
                                    <a th:href="@{/front}">Home</a>
                                </span>
                                <span class="dvdr" th:if="${breadcrumb.items != null and !breadcrumb.items.isEmpty() and !#strings.equalsIgnoreCase(breadcrumb.items[0].titolo, 'Home')}"><i class="fas fa-chevron-right fs-12"></i></span>
                                <th:block th:each="item, iterStat : ${breadcrumb.items}">
                                    <span class="dvdr" th:unless="${iterStat.first}"><i class="fas fa-chevron-right fs-12"></i></span>
                                    <span><a th:href="${item.url != null and item.url.startsWith('/')} ? ${item.url} : '/' + ${item.url}" th:text="${item.titolo}">Sezione</a></span>
                                </th:block>
                                <span class="dvdr"><i class="fas fa-chevron-right fs-12"></i></span>
                                <i th:text="${breadcrumb.itemAttuale}">Pagina</i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="documentTitle">
    <div class="it-breadcrumb-area fix z-index-1"
         th:style="${post != null and post.info5 != null and !post.info5.isEmpty() and post.info5 != '0'} ? 'background-image: url(' + ${config.imagesRepositoryWeb} + ${post.info5} + ');' : 'background-image: url(/site01/assets/img/shape/breadcrumb-1-bg.png);'">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <div class="it-breadcrumb-content text-center z-index-1">
                        <div class="it-breadcrumb-title-box">
                            <h1 class="it-breadcrumb-title" th:text="${post != null ? post.titolo : ''}">Titolo</h1>
                        </div>
                        <div class="it-breadcrumb-list-wrap">
                            <div class="it-breadcrumb-list">
                                <span th:if="${breadcrumb.items == null or breadcrumb.items.isEmpty() or !#strings.equalsIgnoreCase(breadcrumb.items[0].titolo, 'Home')}">
                                    <a th:href="@{/front}">Home</a>
                                </span>
                                <span class="dvdr" th:if="${breadcrumb.items != null and !breadcrumb.items.isEmpty() and !#strings.equalsIgnoreCase(breadcrumb.items[0].titolo, 'Home')}"><i class="fas fa-chevron-right fs-12"></i></span>
                                <th:block th:each="item, iterStat : ${breadcrumb.items}">
                                    <span class="dvdr" th:unless="${iterStat.first}"><i class="fas fa-chevron-right fs-12"></i></span>
                                    <span><a th:href="${item.url != null and item.url.startsWith('/')} ? ${item.url} : '/' + ${item.url}" th:text="${item.titolo}">Sezione</a></span>
                                </th:block>
                                <span class="dvdr"><i class="fas fa-chevron-right fs-12"></i></span>
                                <i th:text="${breadcrumb.itemAttuale}">Pagina</i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
