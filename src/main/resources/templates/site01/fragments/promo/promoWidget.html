<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="promoWidget">
  <section class="promo-widget-area pt-30 pb-30">
    <div class="container">
      <div id="promo-widget-container" class="row justify-content-center" style="display:none;">
        <div class="col-12 col-lg-10">
          <a id="promo-widget-link" href="#" target="_blank" rel="noopener" class="text-decoration-none promo-ad-banner">
            <div class="promo-ad-img-wrap">
              <img id="promo-widget-img" src="" alt=""/>
              <span id="promo-widget-badge" class="promo-ad-badge"></span>
            </div>
            <div class="promo-ad-body">
              <h6 id="promo-widget-title" class="mb-1"></h6>
              <span class="promo-ad-cta">Scopri di più <i class="fa-solid fa-arrow-right"></i></span>
            </div>
          </a>
        </div>
      </div>
    </div>
  </section>

  <style>
    .promo-ad-banner {
        position: relative;
        display: flex;
        align-items: stretch;
        background: #fff;
        border: 1px solid rgba(3, 89, 78, 0.12);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .promo-ad-banner:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.13);
    }
    .promo-ad-img-wrap {
        position: relative;
        flex: 0 0 42%;
        max-width: 42%;
        background: linear-gradient(135deg, #f0f4f3, #e4ece9);
        overflow: hidden;
    }
    .promo-ad-img-wrap img {
        width: 100%;
        height: 100%;
        min-height: 130px;
        object-fit: cover;
        display: block;
    }
    .promo-ad-img-wrap img.promo-widget-img-hidden {
        display: none;
    }
    .promo-ad-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 20px;
    }
    .promo-ad-body {
        flex: 1;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .promo-ad-body h6 {
        font-weight: 700;
        color: #03594e;
        font-size: 19px;
        margin-bottom: 10px;
    }
    .promo-ad-cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: var(--it-theme-1, #1AB69D);
        padding: 7px 16px;
        border-radius: 30px;
        width: fit-content;
    }
    @media (max-width: 576px) {
        .promo-ad-banner {
            flex-direction: column;
        }
        .promo-ad-img-wrap {
            flex: 0 0 auto;
            max-width: 100%;
            aspect-ratio: 16 / 9;
        }
    }
  </style>

  <script th:inline="javascript">
    fetch('/api/promo/all')
        .then(function (response) {
            if (!response.ok) {
                throw new Error('promo fetch failed');
            }
            return response.json();
        })
        .then(function (items) {
            if (!items || items.length === 0) {
                return;
            }
            var randomItem = items[Math.floor(Math.random() * items.length)];
            var img = document.getElementById('promo-widget-img');

            document.getElementById('promo-widget-link').setAttribute('href', randomItem.url);
            document.getElementById('promo-widget-title').textContent = randomItem.titolo;
            document.getElementById('promo-widget-badge').textContent = randomItem.sito;

            img.onerror = function () {
                img.classList.add('promo-widget-img-hidden');
            };
            img.setAttribute('alt', randomItem.titolo);
            img.setAttribute('src', randomItem.img);

            document.getElementById('promo-widget-container').style.display = 'flex';
        })
        .catch(function (err) {
            console.error('Promo widget: errore nel caricamento', err);
        });
  </script>
</th:block>
