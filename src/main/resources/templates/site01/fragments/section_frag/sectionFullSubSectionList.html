<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- sectionType.page3 = 'sectionFullSubSectionList' (full width, senza sidebar)
     Ricostruita con le card corso reali di Educeet (it-course-item). -->
<th:block th:fragment="content">
    <section class="pb-100">
        <div class="container">

            <div th:if="${section.testo != null and !section.testo.isEmpty()}" th:utext="${section.testo}" class="mb-40"></div>

            <style>
                /* card altezza uniforme: colonna flex, titolo clamp 2 righe, testo clamp 3 righe */
                .it-course-item-equal { display: flex; flex-direction: column; height: 100%; width: 100%; }
                .it-course-item-equal .it-course-content { display: flex; flex-direction: column; flex-grow: 1; }
                .it-course-item-equal .it-course-title { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
            </style>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 gx-35" th:if="${section.hasSubsections()}">
                <div class="col mb-35 d-flex" th:each="sub : ${section.subsection}">
                    <div class="it-course-item it-course-item-equal">
                        <div class="it-course-thumb z-index-1 border-radius-20" th:if="${sub.logo != null and !sub.logo.isEmpty()}">
                            <a th:href="@{'/' + ${sub.url}}">
                                <img class="w-100" th:src="${config.imagesRepositoryWeb + sub.logo}" th:alt="${sub.titolo}"/>
                            </a>
                        </div>
                        <div class="it-course-content p-relative">
                            <h5 class="it-course-title mb-20">
                                <a class="border-line" th:href="@{'/' + ${sub.url}}" th:text="${sub.titolo}">Sottosezione</a>
                            </h5>
                            <div class="mb-0"
                                 th:if="${sub.riassunto != null and !sub.riassunto.isEmpty()}" th:utext="${sub.riassunto}"
                                 style="overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;">Descrizione</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>
</th:block>
</body>
</html>
