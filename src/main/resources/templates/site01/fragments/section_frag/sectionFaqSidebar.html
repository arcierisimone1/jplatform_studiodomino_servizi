<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- sectionType.page3 = 'sectionFaqSidebar'
     Ricostruita con l'accordion reale di Educeet (FaqArea.tsx: it-custom-accordion,
     accordion-items, accordion-buttons, accordion-body), al posto del vecchio
     accordion Bootstrap generico. Niente più sidebar Info/Corsi in Partenza,
     fuori contesto su una pagina di domande frequenti. -->
<th:block th:fragment="content">
    <section class="pt-0 pb-100">
        <div class="container">

            <div class="row">
                <div class="col-lg-10 col-xl-9 mx-auto">

                    <div th:if="${section.testo != null and !section.testo.isEmpty()}" th:utext="${section.testo}" class="mb-40"></div>

                    <div class="it-custom-accordion" th:if="${section.hasContenuti()}">
                        <div class="accordion" id="faqAccordion">
                            <div class="accordion-items mb-30" th:each="domanda, iterStat : ${section.contenuti}">
                                <h4 class="accordion-header" th:id="'faqHeading' + ${iterStat.index}">
                                    <button class="accordion-buttons" th:classappend="${!iterStat.first} ? 'collapsed'"
                                            type="button" data-toggle="collapse"
                                            th:data-target="'#faqCollapse' + ${iterStat.index}"
                                            th:aria-expanded="${iterStat.first}"
                                            th:aria-controls="'faqCollapse' + ${iterStat.index}"
                                            th:text="${domanda.titolo}">Domanda</button>
                                </h4>
                                <div th:id="'faqCollapse' + ${iterStat.index}"
                                     th:class="${'accordion-collapse collapse' + (iterStat.first ? ' show' : '')}"
                                     th:aria-labelledby="'faqHeading' + ${iterStat.index}"
                                     data-parent="#faqAccordion">
                                    <div class="accordion-body">
                                        <p class="mb-0" th:utext="${domanda.testo}">Risposta</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>
</th:block>
</body>
</html>
