<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- sectionType.page3 = 'sectionWebSidebar' -->
<th:block th:fragment="content">

    <section class="pt-50 pb-100">
        <div class="container">

            <div th:if="${section.id != null and section.id == 312}" class="mb-40">
                <div class="it-about-section-title-box mb-30">
                    <span class="it-section-subtitle yellow-style">Chi siamo</span>
                    <h2 class="it-section-title" th:text="${section.titolo}">L'azienda</h2>
                </div>
                <!-- immagine nel testo: float a sinistra in stile editoriale -->
                <style>
                    .it-azienda-testo { max-width: 100%; }
                    .it-azienda-testo p { margin-bottom: 18px; text-align: justify; }
                    /* neutralizza il <div class="row"> Bootstrap presente nel testo CMS (margini negativi) */
                    .it-azienda-testo .row { margin-left: 0 !important; margin-right: 0 !important; }
                    .it-azienda-testo .row > * { padding-left: 0 !important; padding-right: 0 !important; }
                    .it-azienda-testo img {
                        max-width: 380px;
                        width: 100%;
                        height: auto;
                        border-radius: 20px;
                        float: left;
                        margin: 0 35px 20px 0;
                    }
                    @media (max-width: 767px) {
                        .it-azienda-testo img { float: none; margin: 0 0 20px; }
                    }
                </style>
                <div class="it-about-text it-azienda-testo" th:utext="${section.testo}"></div>
            </div>

            <th:block th:unless="${section.id != null and section.id == 312}">

                <style>
                    .it-websidebar-testo h1, .it-websidebar-testo h2,
                    .it-websidebar-testo h3, .it-websidebar-testo h4 {
                        font-size: 26px;
                        font-family: var(--it-ff-spartan-semibold);
                        margin: 30px 0 15px;
                    }
                    .it-websidebar-testo h1:first-child, .it-websidebar-testo h2:first-child,
                    .it-websidebar-testo h3:first-child, .it-websidebar-testo h4:first-child { margin-top: 0; }
                    .it-websidebar-testo p { margin-bottom: 20px; }
                    .it-websidebar-testo ul { margin: 0 0 30px; padding: 0; }
                    .it-websidebar-testo ul li {
                        list-style: none;
                        position: relative;
                        padding-left: 32px;
                        margin-bottom: 15px;
                    }
                    .it-websidebar-testo ul li::before {
                        content: "\2713";
                        position: absolute;
                        left: 0;
                        top: -1px;
                        color: var(--it-theme-2);
                        font-weight: 700;
                        font-size: 18px;
                    }
                    .it-websidebar-testo img { max-width: 100%; height: auto; }
                </style>

                <div class="row">
                    <div class="col-lg-10 col-xl-9 mx-auto">

                        <!-- Testo della sezione -->
                        <div class="it-websidebar-testo" th:if="${section.testo != null and !section.testo.isEmpty()}" th:utext="${section.testo}"></div>

                        <!-- Sottosezioni -->
                        <div class="mt-10 mb-40" th:if="${section.hasSubsections()}">
                            <style>
                                /* card altezza uniforme: colonna flex, titolo clamp 2 righe */
                                .it-websidebar-sub-item { display: flex; flex-direction: column; height: 100%; width: 100%; }
                                .it-websidebar-sub-item .rc-post-title { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
                            </style>
                            <div class="row row-cols-1 row-cols-md-2 gx-35">
                                <div class="col mb-30 d-flex" th:each="sub : ${section.subsection}">
                                    <div class="sidebar-widget-post it-websidebar-sub-item">
                                        <div class="rc-post">
                                            <div class="rc-post-content">
                                                <h5 class="rc-post-title">
                                                    <a class="border-line" th:href="@{'/' + ${sub.url}}" th:text="${sub.titolo}">Sottosezione</a>
                                                </h5>
                                                <div th:if="${sub.riassunto != null and !sub.riassunto.isEmpty()}" th:utext="${sub.riassunto}" class="mb-0"
                                                     style="overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;">Descrizione</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Contenuti della sezione -->
                        <div th:if="${section.hasContenuti()}">
                            <h4 class="it-section-title mb-30">Contenuti</h4>

                            <div class="postbox-thumb-box mb-70" th:each="articolo : ${section.contenuti}">
                                <div class="postbox-main-thumb border-radius-20 mb-35" th:if="${articolo.logo != null and !articolo.logo.isEmpty()}">
                                    <a th:href="@{'/' + ${articolo.url}}">
                                        <img class="w-100" th:src="${config.imagesRepositoryWeb + articolo.logo}" th:alt="${articolo.titolo}"/>
                                    </a>
                                </div>
                                <div class="postbox-content-box">
                                    <div class="it-blog-meta mb-20" th:if="${articolo.dataVisualizzata != null and !articolo.dataVisualizzata.isEmpty()}">
                                        <span><i class="fa-solid fa-calendar-days"></i> <span th:text="${articolo.dataVisualizzata}">Data</span></span>
                                    </div>
                                    <h5 class="it-section-title">
                                        <a class="border-line" th:href="@{'/' + ${articolo.url}}" th:text="${articolo.titolo}">Titolo</a>
                                    </h5>
                                    <div class="postbox-dsc" th:if="${articolo.riassunto != null and !articolo.riassunto.isEmpty()}">
                                        <div class="mb-25" th:utext="${articolo.riassunto}">Riassunto</div>
                                    </div>
                                    <a th:href="@{'/' + ${articolo.url}}" class="it-btn-yellow theme-bg">
                                        <span>
                                            <span class="text-1">Leggi di più</span>
                                            <span class="text-2">Leggi di più</span>
                                        </span>
                                        <i><i class="fa-solid fa-arrow-right"></i></i>
                                    </a>
                                </div>
                            </div>

                            <div th:replace="~{site01/fragments/section_frag/_pagination :: nav}"></div>
                        </div>

                        <!-- Allegati -->
                        <div class="sidebar-widget mb-60" th:if="${section.allegati != null and !section.allegati.isEmpty()}">
                            <h5 class="sidebar-widget-title mb-25">Allegati</h5>
                            <ul class="list-unstyled mb-0">
                                <li th:each="allegato : ${section.allegati}" class="mb-15 pb-15" style="border-bottom:1px solid rgba(0,0,0,.08);">
                                    <a th:href="@{'/filesId/' + ${allegato.id} + '/' + ${allegato.l2} + '/' + ${allegato.l1} + '.' + ${allegato.type}}"
                                       target="_blank">
                                        <i class="fa-solid fa-file me-10px"></i>
                                        <span th:text="${allegato.l1}">Nome file</span>
                                    </a>
                                </li>
                            </ul>
                        </div>

                    </div>
                </div>

            </th:block>
        </div>
    </section>

    <section class="it-team-area gray-bg pt-80 pb-90 z-index-1" th:if="${team != null and !team.isEmpty()}">
        <div class="container">

            <div class="it-team-section-title-wrap z-index-1 mb-60">
                <div class="row align-items-end">
                    <div class="col-lg-8 col-md-9">
                        <div class="it-team-section-title-box">
                            <span class="it-section-subtitle yellow-style">Chi siamo</span>
                            <h2 class="it-section-title">Le persone che rendono <br class="d-none d-lg-block"/> grande il nostro team</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row gx-25">
                <div class="col-xxl-2 col-xl-3 col-lg-3 col-md-4 col-sm-6" th:each="admin : ${team}">
                    <div class="it-team-item text-center p-relative mb-35">
                        <div class="it-team-content-box" style="height:140px; overflow:hidden;">
                            <div class="it-team-content">
                                <h4 class="it-team-title" th:text="${admin.nome + ' ' + admin.cognome}">Nome Cognome</h4>
                                <span th:if="${admin.incarico != null and !admin.incarico.isEmpty()}" th:text="${admin.incarico}">Ruolo</span>
                            </div>
                        </div>
                        <div class="it-team-thumb p-relative border-radius-20">
                            <img class="w-100" th:src="@{${admin.avatar}(v=${#dates.createNow().time})}" th:alt="${admin.nome}"/>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</th:block>

</body>
</html>
