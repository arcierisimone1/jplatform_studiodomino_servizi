<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="head">

    <!-- Studiodomino srl Basic Head -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge"/>

    <title th:text="${(config != null && config.sito != null ? config.sito.type : '') +
                  ' | ' +
                  (post != null ? post.titolo : (section != null ? section.titolo : (pageTitle != null ? pageTitle : 'Home')))}">
        Home
    </title>

    <meta name="keywords" th:content="${config != null && config.sito != null ? config.sito.keywords : ''}" />
    <meta name="description"
          th:content="${(post != null and post.riassunto != null and !post.riassunto.isEmpty()) ? #strings.abbreviate(post.riassunto.replaceAll('&lt;[^&gt;]*&gt;', ' '), 160) :
                        ((section != null and section.riassunto != null and !section.riassunto.isEmpty()) ? #strings.abbreviate(section.riassunto.replaceAll('&lt;[^&gt;]*&gt;', ' '), 160) :
                        (config != null && config.sito != null ? config.sito.libero2 : ''))}" />
    <meta name="author" content="Studiodomino srl"/>
    <meta name="DC.Description" th:content="${post != null ? post.titolo : (section != null ? section.titolo : (pageTitle != null ? pageTitle : 'Home'))}"/>
    <link rel="canonical" th:if="${currentUrl != null}" th:href="${currentUrl}" />

    <!-- Favicons -->
    <link rel="icon" type="image/png"
          th:href="@{/site01/images/favicon.png}"/>
    <link rel="shortcut icon" type="image/png"
          th:href="@{/site01/images/favicon.png}"/>
    <link rel="apple-touch-icon"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon.png'}"/>
    <link rel="apple-touch-icon" sizes="72x72"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-72x72.png'}"/>
    <link rel="apple-touch-icon" sizes="114x114"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-114x114.png'}"/>
    <link rel="apple-touch-icon" sizes="144x144"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-144x144.png'}"/>

    <!-- Mobile Specific Metas -->
    <meta name="HandheldFriendly" content="true" />
    <meta name="format-detection" content="telephone=no"/>
    <meta name="author" content="Studiodomino srl - Potenza"/>
    <meta name="robots" content="index, follow"/>

    <!-- CSS (Educeet) -->
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/bootstrap.min.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/font-awesome-pro.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/swiper-bundle.min.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/slick.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/nice-select.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/magnific-popup.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/custom-animation.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/spacing.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/main.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/educeet-custom.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/js/gdpr-cookie-master/css/jquery-eu-cookie-law-popup.css'}">

    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        #google_translate_element { display: none; }
    </style>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

</th:block>
