<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz">
<head>
    <!-- Carica i metatag e i CSS comuni -->
    <th:block th:replace="~{site01/fragments/head :: head}"></th:block>
</head>

<body class="container-1340px">

<!-- Body wrapper -->
<div id="wrapper" class="clearfix">
    <!-- Sezione Header (sostituibile se necessario) -->
    <th:block layout:fragment="header">
        <th:block th:replace="~{site01/fragments/header :: header}"></th:block>
    </th:block>

    <!-- Contenuto Principale: qui verrà iniettato il codice delle singole pagine -->
    <div class="main-content-area" id="main-container">
        <main layout:fragment="content"></main>
    </div>

    <div class="sdcp-widget" id="sdcpWidget">
        <a class="sdcp-pill" href="https://www.polodominopotenza.it/" target="_blank" rel="noopener">
            <span class="sdcp-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="width:16px;height:16px;"><path d="M22 10L12 5 2 10l10 5 10-5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5" stroke="#fff" stroke-width="2"/></svg></span>
            <span class="sdcp-text" id="polo-msg">Costruisci il tuo futuro universitario</span>
        </a>
        <a class="sdcp-pill" href="https://formazione.studiodomino.com/" target="_blank" rel="noopener">
            <span class="sdcp-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="width:16px;height:16px;"><path d="M12 6.5C10.5 5 7.5 4.5 4 5v13c3.5-.5 6.5 0 8 1.5M12 6.5C13.5 5 16.5 4.5 20 5v13c-3.5-.5-6.5 0-8 1.5M12 6.5v14" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="sdcp-text" id="formazione-msg">Trasforma la formazione in opportunità!</span>
        </a>
    </div>

    <th:block th:replace="~{site01/fragments/promo/promoWidget :: promoWidget}"></th:block>

    <!-- Sezione Footer (sostituibile se necessario) -->
    <th:block layout:fragment="footer">
        <th:block th:replace="~{site01/fragments/footer :: footer}"></th:block>
    </th:block>

</div>

<!-- Banner cookie (stile Educeet) -->
<div class="sd-cookie" id="sdCookie" role="dialog" aria-live="polite" aria-label="Informativa sui cookie">
    <h5 class="sd-cookie-title">Cookie</h5>
    <p class="sd-cookie-text">
        Questo sito utilizza solo cookie tecnici, necessari al suo funzionamento.
        Non usiamo cookie di profilazione.
        <a th:href="@{/front/34/Cookie-Policy}">Leggi la Cookie Policy</a>
    </p>
    <a href="#" role="button" class="it-btn-yellow theme-bg" id="sdCookieOk">
                <span>
                    <span class="text-1">Ho capito</span>
                    <span class="text-2">Ho capito</span>
                </span>
    </a>
</div>

<!-- Script JS e Scroll to top -->
<th:block layout:fragment="scripts">
    <th:block th:replace="~{site01/fragments/scripts :: scripts}"></th:block>
</th:block>

</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
            var w = document.getElementById('sdcpWidget');
            if (w) w.classList.add('sdcp-visible');
        }, 2500);

        var rotations = {
            "polo-msg": ["Vuoi iscriverti a un'università telematica?", "Scopri le 4 università telematiche di PoloDomino"],
            "formazione-msg": ["Trasforma la formazione in opportunità!", "Vuoi partecipare a un corso di formazione?", "Vuoi certificarti?", "Scopri il mondo della scuola: doposcuola e supporto didattico"]
        };
        Object.keys(rotations).forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var msgs = rotations[id];
            var i = 0;
            setInterval(function () {
                i = (i + 1) % msgs.length;
                el.style.opacity = 0;
                setTimeout(function () {
                    el.textContent = msgs[i];
                    el.style.opacity = 1;
                }, 300);
            }, 4000);
        });

        // Banner cookie: si mostra solo se non è già stato accettato (6 mesi)
        var box = document.getElementById('sdCookie');
        var ok = document.getElementById('sdCookieOk');
        if (box && ok) {
            var giaAccettato = document.cookie.split(';').some(function (c) {
                return c.trim().indexOf('sd_cookie_ok=') === 0;
            });
            if (!giaAccettato) {
                setTimeout(function () { box.classList.add('sd-cookie-visible'); }, 800);
            }
            ok.addEventListener('click', function (e) {
                e.preventDefault();
                document.cookie = 'sd_cookie_ok=1; max-age=15552000; path=/; SameSite=Lax';
                box.classList.remove('sd-cookie-visible');
            });
        }
    });
</script>
</html>
