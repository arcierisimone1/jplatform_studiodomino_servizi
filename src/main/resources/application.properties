spring.application.name=jplatform_studiodomino

# Rispetta gli header X-Forwarded-* del reverse proxy in produzione (scheme https, host, porta),
# cosi' url canonici, sitemap.xml e robots.txt puntano sempre al dominio pubblico reale e non a http/localhost.
server.forward-headers-strategy=native

# Database MySQL
#mySql in locale nella porta 3306 e il database: db_castellabate. evita warning inutili ed evita problemi con date/ore
spring.datasource.url=jdbc:mysql://localhost:3306/servizi2026?useSSL=false&serverTimezone=Europe/Rome
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
#Hibernate NON deve toccare lo schema del DB
spring.jpa.hibernate.ddl-auto=none
#vedere le query in console e capire cosa fa Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#NON cambiare i nomi delle colonne e delle tabelle?
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server
server.port=8088

# ========== SITE DEFAULT (opzionale) ==========
# Se vuoi specificare un site default diverso da 1
jplatform.site.default.id=1

# ========== SESSION ==========
#Sessione dura 30 minuti
server.servlet.session.timeout=30m
#Cookie personalizzato (evita conflitti).
server.servlet.session.cookie.name=JPLATFORMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ========== LOGGING ==========
logging.level.root=INFO
#Log dettagliati solo per il progetto.
logging.level.com.studiodomino.jplatform=DEBUG
#Vedi richieste HTTP e query SQL per capire cosa succede
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO
#formato leggibile dei log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== THYMELEAF ==========
#ogni modifica html immediata
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========== FILE UPLOAD ==========
#Serve per: allegati, immagini, documenti
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB
server.tomcat.max-parts=1000
# Limite di default di Tomcat per i POST normali (form-urlencoded, non upload
# file) e' 2MB: bastava un testo lungo/riccamente formattato incollato in un
# campo TinyMCE (es. sezione con tabelle, tanti stili inline) per superarlo,
# con errore "Parameters were not parsed because the size of the posted data
# was too big" e salvataggio andato perso senza nessun messaggio chiaro.
server.tomcat.max-http-form-post-size=20MB

#upload.path=/opt/webapp/studiodomino/media/cmss/cms-repository/images/
#allegati.repository.path=/opt/webapp/studiodomino/media/cmss/cms-repository/repository/
# Percorsi locali (sviluppo su questo PC): puntano a una cartella dentro il progetto,
# servita in locale dalla route /cmss/cms-repository/images/** (vedi WebConfig).
# Per il deploy sul server vero, ripristinare i percorsi /opt/webapp/... sopra commentati.
upload.path=/opt/webapp/servizi/media/cmss/cms-repository/images/
allegati.repository.path=/opt/webapp/servizi/media/cmss/cms-repository/repository/

# Prefisso URL per visualizzarle via web
images.repository.web=/cmss/cms-repository/images/

# ========== ENCODING ==========
#Serve per:accenti, caratteri, speciali, testi lunghi
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

sms.gateway.url=https://gateway.skebby.it/api/send/smseasy/advanced/http.php
sms.gateway.username=studiodomino
sms.gateway.password=${SKEBBY_PASSWORD}
sms.gateway.sender=STUDIODOMIN

# ========== SEO / OPEN GRAPH / TWITTER CARD ==========
# URL pubblico del sito, usato per canonical, sitemap.xml assoluta e Open Graph.
# In locale punta a localhost; in produzione ogni sito lo sovrascrive con la env var
# APP_BASE_URL nel proprio docker-compose.yml (stesso meccanismo di UPLOAD_PATH).
app.base-url=${APP_BASE_URL:http://localhost:8089}
# Immagine di fallback per Open Graph/Twitter quando la pagina non ha un'immagine propria.
app.seo.default-image=${APP_SEO_DEFAULT_IMAGE:/site01/images/logo_principale.png}
app.seo.max-title=60
app.seo.max-description=155

# ========== JSON-LD (schema.org) ? dati struttura organizzazione ==========
app.org.name=Studiodomino srl
app.org.type=LocalBusiness
app.org.logo=/site01/images/logo_principale.png
app.org.phone=+39 366 684 4615
app.org.address.street=Via del Gallitello, 74
app.org.address.city=Potenza
app.org.address.zip=85100
app.org.address.region=Basilicata
# Giorni separati da virgola, in inglese: Monday,Tuesday,Wednesday,Thursday,Friday,Saturday,Sunday
app.org.hours.days=Monday,Tuesday,Wednesday,Thursday,Friday
app.org.hours.opens=09:00
app.org.hours.closes=13:00
# Secondo turno (pomeriggio)
app.org.hours.days2=Monday,Tuesday,Wednesday,Thursday,Friday
app.org.hours.opens2=15:00
app.org.hours.closes2=19:00
# Link social, separati da virgola
app.org.sameas=https://www.facebook.com/studiodominoaltaformazione,https://www.instagram.com/studiodomino_formazione